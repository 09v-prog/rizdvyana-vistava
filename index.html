<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бюро різдвяних справ — комікс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Pangolin&display=swap" rel="stylesheet">
<style>
/* Layout idea: comic-book panels in a single column, one scene per chapter; a sticky bar picks the role and how much text is hidden. */
:root{
  --bg:#eef2fa; --panel:#ffffff; --line:#1d2540; --ink:#1d2540; --muted:#59627f;
  --bubble:#ffffff; --capbg:#ffe9a8; --capink:#4a3600; --bar:rgba(238,242,250,.93);
  --dot:rgba(29,37,64,.08); --ts:70%; --tl:94%; --chip:#dfe6f5; --accent:#c98a00;
  --display:'Pangolin','Comic Sans MS',cursive; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1326; --panel:#161e38; --line:#5a6aa0; --ink:#eaf0ff; --muted:#a2aed4;
    --bubble:#222c4d; --capbg:#43360f; --capink:#ffe7a6; --bar:rgba(13,19,38,.93);
    --dot:rgba(255,255,255,.06); --ts:30%; --tl:19%; --chip:#26305a; --accent:#f2c94c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1326; --panel:#161e38; --line:#5a6aa0; --ink:#eaf0ff; --muted:#a2aed4;
  --bubble:#222c4d; --capbg:#43360f; --capink:#ffe7a6; --bar:rgba(13,19,38,.93);
  --dot:rgba(255,255,255,.06); --ts:30%; --tl:19%; --chip:#26305a; --accent:#f2c94c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;line-height:1.45;--me:var(--accent)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 64px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* sticky bar */
.bar{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.ctl{display:flex;align-items:center;gap:6px}
.ctl label{font-size:13px;color:var(--muted)}
select{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:5px 8px;min-width:0;max-width:210px}
.seg{display:flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel);border:0;padding:5px 10px;cursor:pointer;font-size:14px}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tog{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tog:disabled,.seg button:disabled{opacity:.45;cursor:default}
.pills{display:flex;gap:4px;margin-left:auto}
.pills a{display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--line);border-radius:50%;background:var(--panel);color:var(--ink);text-decoration:none;font-weight:800;font-size:14px}
.pills a:hover{background:var(--accent);color:#1d2540}
#theme{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel);cursor:pointer;font-size:20px;line-height:1;padding:0}

/* header */
.hero{padding:28px 0 8px}
.hero h1{font:400 clamp(30px,5vw,46px)/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:68ch}
.stats{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.stats span{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:14px}
.stats b{font-weight:800}

/* scenes */
.scene{--h:220;margin-top:36px;scroll-margin-top:110px}
.banner{color:#fff;border:3px solid var(--line);border-radius:8px;padding:18px 18px 14px;margin-bottom:16px;box-shadow:5px 5px 0 var(--line);
  background-image:radial-gradient(circle,rgba(255,255,255,.28) 1.4px,transparent 1.8px),linear-gradient(135deg,hsl(var(--h) 52% 36%),hsl(var(--h) 55% 20%));
  background-size:22px 22px,auto}
.banner .no{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.banner h2{font:400 clamp(24px,4vw,34px)/1.15 var(--display);margin:2px 0 6px;text-wrap:balance}
.banner p{margin:0;font-size:14px;opacity:.92;max-width:80ch}
.cast{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.cast>div{display:flex;align-items:center;gap:6px;font-size:13px;background:rgba(0,0,0,.28);border-radius:999px;padding:3px 10px 3px 3px}
.cast .av{width:30px;height:30px;border-width:2px;padding:0;background:color-mix(in srgb,var(--c) 28%,#1d2540)}
.mineStat{margin-top:8px;font-size:13px;font-weight:800;color:#ffe9a8}
.grid{display:grid;grid-template-columns:1fr;gap:18px}

/* panels */
.panel{border:3px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:4px 4px 0 var(--line);
  background-color:hsl(var(--h) var(--ts) var(--tl));background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);background-size:10px 10px}
.cap{margin:-2px 0 0;align-self:flex-start;background:var(--capbg);color:var(--capink);border:2px solid var(--line);padding:5px 10px;font-size:13.5px;font-style:italic;max-width:100%}
.panel.capOnly{grid-column:1/-1;padding:8px 12px;box-shadow:none;align-items:center}
.panel.capOnly .cap{align-self:center;text-align:center}
.ep{grid-column:1/-1;font:400 22px var(--display);margin:8px 0 0;padding-bottom:4px;border-bottom:3px solid var(--line)}
.row{display:flex;gap:8px;align-items:flex-start;--c:#555f85}
.row.r{flex-direction:row-reverse}
.av{width:52px;height:52px;flex:none;border-radius:50%;border:2.5px solid var(--line);overflow:hidden;background:color-mix(in srgb,var(--c) 28%,var(--panel))}
.av svg{display:block;width:100%;height:100%}
.bubble{position:relative;flex:1;min-width:0;background:var(--bubble);border:2.5px solid var(--line);border-radius:18px;padding:6px 12px 8px;font-size:16px}
.bubble::before{content:"";position:absolute;top:16px;left:-8.5px;width:13px;height:13px;background:var(--bubble);border-left:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:rotate(45deg)}
.row.r .bubble::before{left:auto;right:-8.5px;border-left:0;border-bottom:0;border-right:2.5px solid var(--line);border-top:2.5px solid var(--line)}
.who{display:inline-block;background:var(--c);color:#fff;font:400 13px var(--display);padding:0 9px;border-radius:999px;margin-bottom:3px}
.t{margin:0;overflow-wrap:anywhere}
.act{color:var(--muted);font-weight:600}
.t .hint,.t .hide,.t .tap{display:none}
.hint{letter-spacing:.06em;color:var(--muted)}
.hide{letter-spacing:.3em;color:var(--muted)}
.tap{font-size:12px;color:var(--muted);font-weight:600}
body[data-mode="hint"] .mine:not(.revealed) .t .full,
body[data-mode="hide"] .mine:not(.revealed) .t .full{display:none}
body[data-mode="hint"] .mine:not(.revealed) .t .hint,
body[data-mode="hide"] .mine:not(.revealed) .t .hide,
body[data-mode="hint"] .mine:not(.revealed) .t .tap,
body[data-mode="hide"] .mine:not(.revealed) .t .tap{display:inline}
.bubble.mine{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent);cursor:pointer}
.bubble.mine::before{border-color:var(--c)}
body.hasrole .row:not(.isme):not(.iscue){opacity:.55}
.bubble.cue{outline:2px dashed var(--me);outline-offset:3px}
.bubble.cue::after{content:"далі твоя репліка ▸";display:block;text-align:right;font-size:11.5px;color:var(--muted);margin-top:2px}
body.focus .panel:not(.rel){display:none}
body.focus .panel.capOnly{display:none}

.song{grid-column:1/-1;text-align:center;font:400 22px/1.5 var(--display);padding:18px 12px;border:3px solid var(--line);border-radius:6px;box-shadow:4px 4px 0 var(--line);
  background-color:hsl(var(--h) var(--ts) var(--tl));background-image:radial-gradient(circle,var(--dot) 1.3px,transparent 1.7px);background-size:10px 10px}
.song small{display:block;font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.song p{margin:0}
.end{text-align:center;font:400 34px var(--display);margin-top:40px}
@media (max-width:520px){
  .av{width:44px;height:44px}
  .bubble{font-size:15.5px}
  .pills{margin-left:0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body data-mode="show">
<header class="bar"><div class="bar-in">
  <div class="ctl"><label for="role">Я граю</label><select id="role"></select></div>
  <div class="seg" id="modes" role="group" aria-label="Як показувати мої репліки">
    <button type="button" data-mode="show" aria-pressed="true">Читати</button>
    <button type="button" data-mode="hint" aria-pressed="false">Підказка</button>
    <button type="button" data-mode="hide" aria-pressed="false">Сховати</button>
  </div>
  <button type="button" class="tog" id="focus" aria-pressed="false">Лише мої</button>
  <nav class="pills" id="pills" aria-label="Сцени"></nav>
  <button type="button" id="theme" aria-label="Змінити тему: світла або темна" title="Світла / темна тема">◐</button>
</div></header>

<main class="wrap">
  <section class="hero">
    <h1>Бюро різдвяних справ</h1>
    <p>Комікс до вистави: усі шість сцен, кожна репліка у своїй бульбашці. Обери роль, і твої репліки підсвітяться. У режимі «Підказка» лишаються перші літери слів, у режимі «Сховати» текст зникає. Торкнись бульбашки, щоб перевірити себе.</p>
    <div class="stats" id="stats" aria-live="polite"></div>
  </section>
  <div id="root"></div>
</main>

: "Пані Порядок", "x": "Увага! Увага! Усі на свої місця! У нас надзвичайна різдвяна ситуація!", "a": ""}, {"t": "line", "w": "Рута", "x": "Я ж казала!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "А можна я не буду знати, що сталося?", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Не можна! Бо сталося те чого не мало статися!", "a": ""}, {"t": "line", "w": "Лада", "x": "Пані Порядок, прошу конкретніше. Я повинна внести подію до журналу.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Зникла Різдвяна зірка!", "a": ""}, {"t": "cap", "x": "Пауза. Усі переглядаються."}, {"t": "line", "w": "Рута", "x": "Яка саме зірка?", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Та сама! Головна! Восьмикутна!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Та, що на небі?", "a": ""}, {"t": "line", "w": "Лада", "x": "Не просто на небі, Гавриле. Це Різдвяна зірка. Вона має особливе значення.", "a": ""}, {"t": "line", "w": "Рута", "x": "І де вона зараз?", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Якби я знала, Рутo, я б не збирала тут усіх!", "a": ""}, {"t": "cap", "x": "Лада швидко підходить до великої книги, перегортає сторінки."}, {"t": "line", "w": "Лада", "x": "Зачекайте! Я дещо пригадала. У нашому архіві є окрема справа про Восьмикутну зірку.", "a": ""}, {"t": "line", "w": "Рута", "x": "І ти досі про неї мовчала?", "a": ""}, {"t": "line", "w": "Лада", "x": "Я не мовчала. Просто цю справу відкривають лише в особливих випадках.", "a": ""}, {"t": "cap", "x": "Лада знаходить старовинний аркуш."}, {"t": "line", "w": "Лада", "x": "Ось! Тут написано: «Вісім променів має зірка різдвяна. Вісім дарів береже вона. І поки живуть вони у людських серцях, світло її не згасне».", "a": ""}, {"t": "line", "w": "Рута", "x": "Вісім дарів? Яких саме?", "a": ""}, {"t": "line", "w": "Лада", "x": "Тут є перелік, але пояснення пошкоджене…", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Читай, що залишилося!", "a": ""}, {"t": "line", "w": "Лада", "x": "Віра… Надія… Любов… Добро… Радість… Родина… Милосердя… і Світло.", "a": ""}, {"t": "cap", "x": "Невелика пауза."}, {"t": "line", "w": "Рута", "x": "І що це означає?", "a": ""}, {"t": "line", "w": "Лада", "x": "Не знаю. У наступній частині запису бракує сторінок.", "a": ""}, {"t": "line", "w": "Рута", "x": "Чудово! Значить, маємо не одну, а дві справи: знайти зірку і з'ясувати, що сталося з легендою!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Ніхто нікуди не біжить без дозволу! Спочатку ми повинні встановити обставини зникнення.", "a": ""}, {"t": "cap", "x": "Раптом за дверима чути галас."}, {"t": "line", "w": "Рута", "x": "Хтось іде!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Я перевірю!", "a": ""}, {"t": "cap", "x": "Гаврило підходить до дверей. Заходять Марта й Тимко. Тимко мало не врізається в Гаврила."}, {"t": "line", "w": "Гаврило", "x": "Агов! Куди так поспішаєте? Тут узагалі-то режимний об'єкт!", "a": ""}, {"t": "line", "w": "Тимко", "x": "Мені потрібно терміново поговорити з керівницею Бюро.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Ти хто такий? І як потрапив сюди без реєстрації?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Я прийшов, бо побачив дещо дивне.", "a": ""}, {"t": "line", "w": "Рута", "x": "Що саме?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Я бачив небо.", "a": ""}, {"t": "line", "w": "Лада", "x": "І що з ним не так?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Зазвичай там є зірки. А сьогодні однієї не побачив. Тієї самої Різдвяної зірки!", "a": ""}, {"t": "cap", "x": "Усі завмирають."}, {"t": "line", "w": "Пані Порядок", "x": "Звідки ти знаєш про зірку?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Бо я побачив, як її світло згасало.", "a": ""}, {"t": "line", "w": "Рута", "x": "Де? Коли? Що саме відбулося?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Ой, скільки запитань! Можна я спочатку трохи переведу подих?", "a": ""}, {"t": "line", "w": "Лада", "x": "Ні, не можна. Розповідайте все по порядку.", "a": ""}, {"t": "line", "w": "Тимко", "x": "По порядку? Ну, спочатку я йшов…Ні! Не так. Я побачив дивне світло над містом. Воно спалахнуло, ніби хтось запалив величезний ліхтар, а потім почало зникати. І раптом небо стало темним.", "a": ""}, {"t": "line", "w": "Рута", "x": "Ти бачив, куди поділася зірка?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Ні. Але я знайшов ось це.", "a": ""}, {"t": "cap", "x": "Тимко дістає маленький предмет або аркуш із намальованим восьмикутним знаком."}, {"t": "line", "w": "Лада", "x": "Це… знак із нашого архіву!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Негайно покладіть його на стіл!", "a": ""}, {"t": "cap", "x": "Тимко кладе знахідку."}, {"t": "line", "w": "Рута", "x": "Отже, ми маємо першу зачіпку!", "a": ""}, {"t": "line", "w": "Лада", "x": "І вона пов'язана з давньою легендою.", "a": ""}, {"t": "cap", "x": "Пані Порядок ударяє дзвіночком."}, {"t": "line", "w": "Пані Порядок", "x": "Ладо! Піднімай архіви. Руто! Перевір усі можливі сліди. Гавриле! Пильнуй вхід і цього разу не спи!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Я не спав. Я подумки охороняв.", "a": ""}, {"t": "line", "w": "Рута", "x": "А ми з..", "a": ""}, {"t": "line", "w": "Тимко", "x": "Тимко!", "a": ""}, {"t": "line", "w": "Рута", "x": "А ми з Тимком, будемо шукати підказки!", "a": ""}, {"t": "line", "w": "Лада", "x": "Не так швидко. Спочатку треба зрозуміти, що означають вісім променів.", "a": ""}, {"t": "line", "w": "Тимко", "x": "Здається, у нас попереду багато роботи.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Тоді до роботи! Бо без Різдвяної зірки Різдво може залишитися без свого головного світла!", "a": ""}, {"t": "cap", "x": "Музика. Персонажі розходяться по сцені, кожен береться за своє завдання. На проєкторі з'являється зображення восьмикутної зірки, один промінь якої поступово гасне. Затемнення."}]}, {"n": 2, "title": "Таємниця різдвяної зірки", "setting": "", "prop": "", "items": [{"t": "cap", "x": "На екрані — зимовий ліс або засніжена галявина. Команда Бюро виходить на сцену. Усі озираються, шукають сліди."}, {"t": "line", "w": "Тимко", "x": "Ну і куди ми прийшли?", "a": ""}, {"t": "line", "w": "Рута", "x": "Ми шукаємо Різдвяну зірку, а не місце для прогулянки!", "a": ""}, {"t": "line", "w": "Тимко", "x": "Я просто уточнюю. Раптом ми вже знайшли, а я не помітив.", "a": ""}, {"t": "line", "w": "Гаврило", "x": "А я пропоную зробити перерву. Пошуки — це дуже виснажлива справа.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Ніяких перерв! Поки не знайдемо зірку, ніхто нікуди не розходиться.", "a": ""}, {"t": "line", "w": "Лада", "x": "Зачекайте. Подивіться сюди. Тут щось є.", "a": ""}, {"t": "cap", "x": "Лада знаходить на землі невелику блискучу деталь або паперовий промінчик зірки."}, {"t": "line", "w": "Рута", "x": "Що це?", "a": ""}, {"t": "line", "w": "Лада", "x": "Схоже на промінь. Можливо, він від Різдвяної зірки.", "a": ""}, {"t": "line", "w": "Рута", "x": "Значить, ми на правильному шляху!", "a": ""}, {"t": "line", "w": "Тимко", "x": "А може, це просто блискуча обгортка від цукерки?", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Якщо цукерка була смачна, я готовий допомогти в розслідуванні.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Зосередилися! Нам потрібні докази.", "a": ""}, {"t": "cap", "x": "Раптом чується дзвіночок. З'являється Зірочниця."}, {"t": "line", "w": "Зірочниця", "x": "Кого це занесло до моєї галявини?", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Ми з Бюро різдвяних справ. Шукаємо Різдвяну зірку. Ви щось знаєте про неї?", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Різдвяну зірку? Звичайно, знаю. Хіба є хтось, хто не знає про неї?", "a": ""}, {"t": "line", "w": "Рута", "x": "Тоді скажіть, де вона!", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Якби ж я могла так просто відповісти. Зірка не зникла без сліду. Її світло почало згасати.", "a": ""}, {"t": "line", "w": "Лада", "x": "Але чому?", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Кажуть, що кожен із восьми її променів має особливу силу. Коли люди забувають про ці сили, зірка втрачає своє сяйво.", "a": ""}, {"t": "line", "w": "Тимко", "x": "Тобто треба повернути їй усі вісім променів?", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Не просто повернути. Треба знову розбудити те, що вони означають.", "a": ""}, {"t": "line", "w": "Тимко", "x": "А це складно?", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Набагато складніше, ніж здається.", "a": ""}, {"t": "cap", "x": "З-за Зірочниці визирає Іскринка."}, {"t": "line", "w": "Іскринка", "x": "А я знаю, що треба робити!", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Іскринко, ти знову підслуховуєш?", "a": ""}, {"t": "line", "w": "Іскринка", "x": "Я не підслуховую! Я просто дуже уважно слухаю!", "a": ""}, {"t": "line", "w": "Тимко", "x": "О, нарешті хтось із нашої команди!", "a": ""}, {"t": "line", "w": "Іскринка", "x": "А ви справді шукаєте зірку?", "a": ""}, {"t": "line", "w": "Лада", "x": "Так. Допоможеш нам?", "a": ""}, {"t": "line", "w": "Іскринка", "x": "Звичайно! Я знаю одну стару різдвяну історію. У ній є підказка!", "a": ""}, {"t": "line", "w": "Лада", "x": "Яка саме?", "a": ""}, {"t": "line", "w": "Іскринка", "x": "Щоб зірка знову засяяла, треба пригадати, що робить Різдво справжнім.", "a": ""}, {"t": "line", "w": "Рута", "x": "Це ми вже чули. А конкретніше?", "a": ""}, {"t": "line", "w": "Іскринка", "x": "А конкретніше… треба побачити, як люди готуються до Різдва, як допомагають одне одному, як збираються разом.", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Саме так. Почніть із тих, хто вже готує різдвяний стіл. Можливо, там ви знайдете першу відповідь.", "a": ""}, {"t": "line", "w": "Тимко", "x": "Різдвяний стіл? А там уже все готове?", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Оце правильне запитання!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Не заради їжі ми сюди прийшли!", "a": ""}, {"t": "line", "w": "Тимко", "x": "Я знаю. Але розслідувати на голодний шлунок теж непросто.", "a": ""}, {"t": "line", "w": "Лада", "x": "Отже, наша наступна зупинка — різдвяна кухня.", "a": ""}, {"t": "line", "w": "Рута", "x": "Ходімо! Не можна гаяти часу!", "a": ""}, {"t": "cap", "x": "Усі вирушають. Зірочниця залишається на галявині разом з Іскринкою."}, {"t": "line", "w": "Іскринка", "x": "Вони обов'язково знайдуть зірку?", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Дуже на це сподіваюся. Адже скоро Різдво.", "a": ""}, {"t": "line", "w": "Іскринка", "x": "А можна я теж піду їм допомагати?", "a": ""}, {"t": "line", "w": "Зірочниця", "x": "Звичайно. Тільки не загубися дорогою!", "a": ""}, {"t": "cap", "x": "Іскринка радісно біжить услід за командою. Зірочниця махає їм рукою. Затемнення."}]}, {"n": 3, "title": "Дідух — пам’ять родини", "setting": "на проєкторі — українська світлиця, вечір, різдвяна атмосфера.", "prop": "невеликий сніп пшениці або жита, перев'язаний красивою стрічкою.", "items": [{"t": "cap", "x": "Після зустрічі із Зірочницею герої прямують далі. На сцені з'являється маленька дівчинка. Вона тримає в руках золотистий сніп колосків."}, {"t": "line", "w": "Тимко", "x": "О! А це хто в нас тут?", "a": ""}, {"t": "line", "w": "Рута", "x": "Зачекай, не перебивай. Можливо, вона знає щось про зірку.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Добрий вечір! Ми шукаємо Різдвяну зірку. Ти випадково не бачила її?", "a": ""}, {"t": "line", "w": "Дідух", "x": "Я зірки не бачила. Але знаю дещо про Різдво!", "a": ""}, {"t": "line", "w": "Іскринка", "x": "А що це в тебе в руках?", "a": ""}, {"t": "line", "w": "Дідух", "x": "Це Дідух! Його ставили в українській хаті на Різдво.", "a": ""}, {"t": "line", "w": "Лада", "x": "Я читала про це в нашому архіві. Дідух — символ пам'яті про предків і добробуту родини.", "a": ""}, {"t": "line", "w": "Дідух", "x": "Так! У ньому — зернятка, з яких виростає хліб. А хліб годує родину.", "a": ""}, {"t": "line", "w": "Гаврило", "x": "А його можна їсти?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Гавриле, це ж не булочка!", "a": ""}, {"t": "line", "w": "Дідух", "x": "Ні, мій сніп не для їжі. Він нагадує нам про землю, працю і людей, які вирощували хліб.", "a": "усміхається"}, {"t": "line", "w": "Тимко", "x": "А чому його називають Дідухом?", "a": ""}, {"t": "line", "w": "Дідух", "x": "Бо він нагадує про наших дідусів, бабусь і всіх рідних, які жили до нас. Про тих, завдяки кому ми маємо свої традиції.", "a": ""}, {"t": "line", "w": "Рута", "x": "То виходить, він зберігає пам'ять про родину?", "a": ""}, {"t": "line", "w": "Дідух", "x": "Так! А на Різдво вся родина збирається разом. Хтось накриває на стіл, хтось готує страви, хтось співає колядки. І кожен важливий.", "a": ""}, {"t": "line", "w": "Іскринка", "x": "Бо разом тепліше!", "a": ""}, {"t": "line", "w": "Дідух", "x": "Саме так. Коли ми пам'ятаємо одне про одного і тримаємося разом, у нашій родині живе світло.", "a": ""}, {"t": "cap", "x": "На проєкторі з'являється восьмипроменева зірка. Один промінь поступово засвічується."}, {"t": "line", "w": "Лада", "x": "Дивіться! Ще один промінь!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Це промінь Родини!", "a": ""}, {"t": "line", "w": "Тимко", "x": "То ми вже ближче до розгадки!", "a": ""}, {"t": "line", "w": "Дідух", "x": "А тепер вам час далі. Шукайте там, де на Святвечір збирається вся родина. Там на вас уже чекають!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "А там буде щось смачненьке?", "a": ""}, {"t": "line", "w": "Тимко", "x": "Оце я розумію — правильне запитання!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Командо, вирушаємо! Наступна зупинка — різдвяний стіл!", "a": ""}, {"t": "cap", "x": "Усі вирушають зі сцени. Дідух махає їм рукою, притискаючи сніп до себе. Затемнення."}]}, {"n": 4, "title": "Різдвяний стіл", "setting": "на проєкторі — святкова українська світлиця, стіл зі стравами Святвечора. Можна використати намальований стіл на екрані, а персонажі-страви виходять у простих тематичних деталях костюмів.", "prop": "", "items": [{"t": "cap", "x": "Після зустрічі з Дідухом герої заходять до світлиці. Чути веселу музику. На сцені вже зібралися різдвяні страви."}, {"t": "line", "w": "Тимко", "x": "Ого! Оце ми, здається, потрапили куди треба!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Я ж казав, що десь має бути вечеря!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Не відволікаємося. Ми прийшли шукати наступну підказку.", "a": ""}, {"t": "cap", "x": "Раптом чути голос Куті."}, {"t": "line", "w": "Кутя", "x": "А хто це до нас завітав? Невже гості?", "a": ""}, {"t": "line", "w": "Узвар", "x": "Гості? А нас попереджали?", "a": ""}, {"t": "line", "w": "Пампушки", "x": "А ми вже готові!", "a": ""}, {"t": "line", "w": "Вареники", "x": "І ми! І ми!", "a": ""}, {"t": "line", "w": "Лада", "x": "Добрий вечір! Ми шукаємо Різдвяну зірку. Можливо, ви знаєте, де знайти її промінь?", "a": ""}, {"t": "line", "w": "Кутя", "x": "Різдвяну зірку? А ви знаєте, що без мене Святвечір не Святвечір?", "a": ""}, {"t": "line", "w": "Узвар", "x": "Перепрошую! А хто ж тоді напій до святкової вечері? Без мене теж ніяк!", "a": ""}, {"t": "line", "w": "Пампушки", "x": "А хто найпухкіший? Хто найсмачніший?", "a": ""}, {"t": "line", "w": "Вареники", "x": "А хто найрізноманітніший? Нас із різними начинками можна готувати!", "a": ""}, {"t": "line", "w": "Тимко", "x": "Здається, ми потрапили на конкурс «Хто головніший на столі».", "a": ""}, {"t": "line", "w": "Рута", "x": "Тихо! Давайте послухаємо, що вони скажуть.", "a": ""}, {"t": "line", "w": "Кутя", "x": "Я — головна страва Святвечора! У мені пшениця, мак, мед. Я символізую достаток і єдність родини.", "a": ""}, {"t": "line", "w": "Узвар", "x": "А я нагадую про щедрість природи. У мені — сушені фрукти, вода і трішки солодкого смаку!", "a": ""}, {"t": "line", "w": "Пампушки", "x": "А ми — пухкенькі, рум’яні та запашні!", "a": ""}, {"t": "line", "w": "Вареники", "x": "А ми можемо бути з картоплею, капустою, вишнями! І нас завжди багато!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "А можна я вас усіх спробую?", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Гавриле!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Що? Я ж хочу перевірити, чи всі смачні!", "a": ""}, {"t": "cap", "x": "Страви починають сперечатися між собою."}, {"t": "line", "w": "Кутя", "x": "Без мене не починають Святу вечерю!", "a": ""}, {"t": "line", "w": "Узвар", "x": "Але ж без напою не обійтися!", "a": ""}, {"t": "line", "w": "Пампушки", "x": "Ми теж потрібні!", "a": ""}, {"t": "line", "w": "Вареники", "x": "І ми!", "a": ""}, {"t": "line", "w": "Іскринка", "x": "А чому ви сперечаєтеся? Ви ж усі на одному столі!", "a": ""}, {"t": "cap", "x": "На мить усі замовкають."}, {"t": "line", "w": "Лада", "x": "Хіба важливо, хто з вас найголовніший?На Святвечір усі страви мають своє місце. Кожна особлива по-своєму.", "a": ""}, {"t": "line", "w": "Рута", "x": "Може, справа не в тому, хто головніший, а в тому, що ви разом створюєте свято?", "a": ""}, {"t": "line", "w": "Кутя", "x": "Разом?", "a": ""}, {"t": "line", "w": "Узвар", "x": "А й справді. Я ніколи про це не думав.", "a": ""}, {"t": "line", "w": "Пампушки", "x": "То ми всі потрібні?", "a": ""}, {"t": "line", "w": "Вареники", "x": "Усі-всі?", "a": ""}, {"t": "line", "w": "Іскринка", "x": "Звичайно! Бо свято стає святом, коли ним діляться!", "a": ""}, {"t": "cap", "x": "Кутя повертається до інших страв."}, {"t": "line", "w": "Кутя", "x": "Пробачте, друзі. Я так хотіла бути найважливішою, що забула: без вас цей стіл був би не таким святковим.", "a": ""}, {"t": "line", "w": "Узвар", "x": "І ти мене пробач. Давайте святкувати разом!", "a": ""}, {"t": "line", "w": "Пампушки", "x": "Ми за!", "a": ""}, {"t": "line", "w": "Вареники", "x": "І ми!", "a": ""}, {"t": "cap", "x": "Усі страви стають поруч, утворюючи спільну святкову картину."}, {"t": "line", "w": "Тимко", "x": "Ну ось! Нарешті домовилися. А то я вже боявся, що вечеря закінчиться сваркою.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Зачекайте! Подивіться на зірку!", "a": ""}, {"t": "cap", "x": "На проєкторі з’являється восьмипроменева зірка. Ще один промінь поступово засвічується."}, {"t": "line", "w": "Лада", "x": "Ще один промінь повернувся!", "a": ""}, {"t": "line", "w": "Рута", "x": "Це промінь Добра!", "a": ""}, {"t": "line", "w": "Тимко", "x": "Бо добро — це не тільки допомагати. Це ще й уміти ділитися, поступатися та не забувати про інших.", "a": ""}, {"t": "line", "w": "Кутя", "x": "Тепер ми це зрозуміли!", "a": ""}, {"t": "line", "w": "Узвар", "x": "На Різдво ніхто не повинен залишатися сам.", "a": ""}, {"t": "line", "w": "Пампушки", "x": "Треба ділитися!", "a": ""}, {"t": "line", "w": "Вареники", "x": "І бути разом!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Дякуємо вам! Ми знайшли ще один промінь. Але попереду ще багато роботи.", "a": ""}, {"t": "line", "w": "Кутя", "x": "Тоді вирушайте далі! Адже Різдво не обходиться без пісні!", "a": ""}, {"t": "line", "w": "Тимко", "x": "О! Нарешті я знаю, куди ми прямуємо!", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Тільки нехай там теж буде щось смачне!", "a": ""}, {"t": "cap", "x": "Усі сміються. Страви вітають героїв. Герої вирушають далі. Лунає короткий музичний програш."}]}, {"n": 5, "title": "Колядники — добра звістка", "setting": "на проєкторі — засніжена українська вулиця, будинки з освітленими вікнами. Чути дзвіночки, легку святкову музику.", "prop": "", "items": [{"t": "cap", "x": "Герої виходять на сцену після зустрічі з різдвяними стравами."}, {"t": "line", "w": "Тимко", "x": "Цікаво, куди нас цього разу приведе розслідування?", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Головне, щоб не знову шукати щось у темряві.", "a": ""}, {"t": "line", "w": "Рута", "x": "Тихо! Чуєте?", "a": ""}, {"t": "cap", "x": "Здалеку лунають дзвіночки. З'являються колядники. Вони йдуть гуртом, тримаючи зірочки та маленькі дзвіночки."}, {"t": "line", "w": "Колядник 1", "x": "Добрий вечір вашій хаті!", "a": ""}, {"t": "line", "w": "Колядник 2", "x": "Ми прийшли вас привітати!", "a": ""}, {"t": "line", "w": "Колядник 3", "x": "З Різдвом Христовим побажати!", "a": ""}, {"t": "line", "w": "Колядник 4", "x": "Щастя, миру і добра!", "a": ""}, {"t": "line", "w": "Колядник 5", "x": "Щоб раділа вся сім'я!", "a": ""}, {"t": "line", "w": "Колядник 6", "x": "Щоб надія не згасала!", "a": ""}, {"t": "line", "w": "Колядник 7", "x": "Щоб Різдвяна зірка сяяла!", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Вітаємо вас! Як добре, що ми зустріли колядників.", "a": ""}, {"t": "line", "w": "Лада", "x": "Ви несете таку радість із собою!", "a": ""}, {"t": "line", "w": "Колядник 1", "x": "Бо коляда — це добра звістка!", "a": ""}, {"t": "line", "w": "Колядник 2", "x": "Ми сповіщаємо всіх про народження Христа.", "a": ""}, {"t": "line", "w": "Колядник 3", "x": "І бажаємо кожному миру та щастя.", "a": ""}, {"t": "line", "w": "Тимко", "x": "А ви не боїтеся ходити від хати до хати в таку погоду?", "a": ""}, {"t": "line", "w": "Колядник 4", "x": "Ні! Бо нас зігріває пісня.", "a": ""}, {"t": "line", "w": "Колядник 5", "x": "І ми знаємо, що на нас чекають.", "a": ""}, {"t": "cap", "x": "Колядники співають:"}, {"t": "song", "l": ["Зірка в небі засіяла,", "Добру звістку нам послала.", "Хай у кожному віконці", "Буде радість, наче сонце!"]}, {"t": "cap", "x": "Після колядки на проєкторі з'являється Різдвяна зірка. Ще один промінь поступово засвічується."}, {"t": "line", "w": "Лада", "x": "Погляньте! Зірка знову стала яскравішою!", "a": ""}, {"t": "line", "w": "Рута", "x": "Це промінь Надії! Бо коляда нагадує людям, що навіть після найтемнішої ночі приходить світло.", "a": ""}, {"t": "line", "w": "Пані Порядок", "x": "Ми знайшли ще один промінь. Але чогось іще не вистачає…", "a": ""}, {"t": "line", "w": "Тимко", "x": "Може, треба ще голосніше колядувати?", "a": ""}, {"t": "line", "w": "Гаврило", "x": "Я можу! Я дуже голосно вмію!", "a": ""}, {"t": "line", "w": "Колядник 6", "x": "Не тільки пісня потрібна Різдву.", "a": ""}, {"t": "line", "w": "Колядник 7", "x": "Іноді комусь по  'Кутя':{c:'#a0522d',svg:()=>`<path d="M8 34 Q8 62 32 62 Q56 62 56 34Z" fill="#f4e3c1" stroke="${INK}" stroke-width="2"/><ellipse cx="32" cy="34" rx="24" ry="8" fill="#e6b84a" stroke="${INK}" stroke-width="2"/><circle cx="20" cy="33" r="1.4" fill="#4a2a1a"/><circle cx="29" cy="36" r="1.4" fill="#4a2a1a"/><circle cx="40" cy="32" r="1.4" fill="#4a2a1a"/><circle cx="46" cy="36" r="1.4" fill="#4a2a1a"/><circle cx="35" cy="31" r="1.4" fill="#4a2a1a"/>${faceOnly(32,48)}<path d="M50 14 L40 30" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="52.5" cy="10" rx="4" ry="6" transform="rotate(30 52.5 10)" fill="#d9d9d9" stroke="${INK}" stroke-width="1.8"/>`},
 'Узвар':{c:'#8b2252',svg:()=>`<path d="M47 24 Q60 26 58 40 Q56 48 46 47" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><path d="M47 24 Q60 26 58 40 Q56 48 46 47" fill="none" stroke="#c9742b" stroke-width="2.5" stroke-linecap="round"/><path d="M17 16 H47 V54 Q47 62 39 62 H25 Q17 62 17 54Z" fill="#c9742b" stroke="${INK}" stroke-width="2"/><rect x="14" y="11" width="36" height="7" rx="3.5" fill="#e2924a" stroke="${INK}" stroke-width="2"/><ellipse cx="32" cy="22" rx="12" ry="2.6" fill="#7a1d3f" opacity=".75"/>${faceOnly(32,40)}`},

 'Колядник':{c:'#2c6aa8',svg:()=>`${body('#2c6aa8')}<path d="M53 66 V26" stroke="#8a5a2a" stroke-width="3" stroke-linecap="round"/>${star(53,18,9,4,'#ffd24a')}${head()}<path d="M17 31 Q17 14 32 14 Q47 14 47 31 Q42 25 32 25 Q22 25 17 31Z" fill="#2c6aa8" stroke="${INK}" stroke-width="2"/><circle cx="32" cy="12" r="4" fill="#f4f4f4" stroke="${INK}" stroke-width="1.8"/>`},
 'Усі':{c:'#555f85',svg:()=>`<circle cx="18" cy="42" r="10" fill="${SK}" stroke="${INK}" stroke-width="2"/><circle cx="46" cy="42" r="10" fill="${SK}" stroke="${INK}" stroke-width="2"/><circle cx="32" cy="30" r="12" fill="${SK}" stroke="${INK}" stroke-width="2"/>${faceOnly(32,29,.8)}${faceOnly(18,41,.6)}${faceOnly(46,41,.6)}${star(32,8,6,2.8,'#ffd24a')}`}
};
const group=n=>n.startsWith('Колядник')?'Колядник':n;
const chOf=n=>CH[group(n)]||CH['Усі'];
const av=n=>`<div class="av" aria-hidden="true"><svg viewBox="0 0 64 64">${chOf(n).svg()}</svg></div>`;
const words=s=>(s.match(/[\p{L}’'\-]+/gu)||[]).length;
const hintOf=s=>s.replace(/[\p{L}’'\-]+/gu,w=>w[0]+'…');
const chunk=a=>{const k=Math.ceil(a.length/4),sz=Math.ceil(a.length/k),r=[];for(let i=0;i<a.length;i+=sz)r.push(a.slice(i,i+sz));return r};

function panelsOf(sc){
  const out=[];let cap=null,buf=[];
  const flush=()=>{
    if(buf.length){chunk(buf).forEach((c,i)=>out.push({cap:i?null:cap,lines:c}));buf=[];cap=null}
    else if(cap){out.push({cap,lines:[]});cap=null}
  };
  for(const it of sc.items){
    if(it.t==='cap'){flush();cap=it.x}
    else if(it.t==='line'){buf.push(it)}
    else{flush();out.push(it.t==='ep'?{ep:it.x}:it.t==='song'?{song:it.l}:{end:true})}
  }
  flush();return out;
}
function rowHtml(it,side){
  const c=chOf(it.w).c;
  return `<div class="row${side?' r':''}" style="--c:${c}"><div class="avwrap">${av(it.w)}</div><div class="bubble" data-w="${esc(it.w)}"><span class="who">${esc(it.w)}</span><p class="t"><span class="full">${it.a?`<em class="act">(${esc(it.a)})</em> `:''}${esc(it.x)}</span><span class="hint">${esc(hintOf(it.x))}</span><span class="hide">· · · · ·</span><span class="tap"> торкни, щоб показати</span></p></div></div>`;
}
function render(){
  let h='',pills='';
  DATA.forEach(sc=>{
    pills+=`<a href="#scene-${sc.n}" title="Сцена ${sc.n}. ${esc(sc.title)}">${sc.n}</a>`;
    const names=[...new Set(sc.items.filter(i=>i.t==='line'&&i.w!=='Усі').map(i=>group(i.w)))];
    const cast=names.map(n=>`<div style="--c:${chOf(n).c}">${av(n)}<span>${n==='Колядник'?'Колядники':n}${ACTOR[n]?' · '+ACTOR[n]:''}</span></div>`).join('');
    h+=`<section class="scene" id="scene-${sc.n}" data-n="${sc.n}" style="--h:${HUE[sc.n]}"><div class="banner"><div class="no">Сцена ${sc.n}</div><h2>${esc(sc.title)}</h2><p>${esc(sc.setting)}</p>${sc.prop?`<p>Реквізит: ${esc(sc.prop)}</p>`:''}<div class="cast">${cast}</div><div class="mineStat" data-scene-stat></div></div><div class="grid">`;
    panelsOf(sc).forEach(p=>{
      if(p.ep){h+=`<h3 class="ep">${esc(p.ep)}</h3>`}
      else if(p.song){h+=`<div class="song"><small>Колядка</small>${p.song.map(l=>`<p>♪ ${esc(l)}</p>`).join('')}</div>`}
      else if(p.end){h+=`</div><div class="end">Кінець</div><div class="grid">`}
      else{
        const order=[];
        const rows=p.lines.map(it=>{let i=order.indexOf(it.w);if(i<0){order.push(it.w);i=order.length-1}return rowHtml(it,i%2)}).join('');
        h+=`<article class="panel${p.lines.length?'':' capOnly'}">${p.cap?`<p class="cap">${esc(p.cap)}</p>`:''}${rows}</article>`;
      }
    });
    h+=`</div></section>`;
  });
  document.getElementById('root').innerHTML=h;
  document.getElementById('pills').innerHTML=pills;
}
render();

/* roles */
const roleSel=document.getElementById('role');
const seen=[];DATA.forEach(sc=>sc.items.forEach(i=>{if(i.t==='line'&&i.w!=='Усі'&&!seen.includes(i.w))seen.push(i.w)}));
roleSel.innerHTML='<option value="">Усі ролі</option>'+seen.map(n=>`<option value="${esc(n)}">${esc(n)}${ACTOR[n]?' · '+ACTOR[n]:''}</option>`).join('');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function applyRole(){
  const role=roleSel.value;
  const bubbles=$$('.bubble');
  const isMine=b=>role&&(b.dataset.w===role||b.dataset.w==='Усі');
  document.body.classList.toggle('hasrole',!!role);
  if(role)document.body.style.setProperty('--me',chOf(role).c);else document.body.style.removeProperty('--me');
  bubbles.forEach((b,i)=>{
    const m=isMine(b),next=bubbles[i+1],cue=role&&!m&&next&&isMine(next);
    b.classList.toggle('mine',!!m);
    if(!m)b.classList.remove('revealed');
    b.classList.toggle('cue',!!cue);
    b.closest('.row').classList.toggle('isme',!!m);
    b.closest('.row').classList.toggle('iscue',!!cue);
    if(m){b.tabIndex=0;b.setAttribute('role','button')}else{b.removeAttribute('tabindex');b.removeAttribute('role')}
  });
  $$('.panel').forEach(p=>p.classList.toggle('rel',!!p.querySelector('.mine,.cue')));
  $('#focus').disabled=!role;
  if(!role){document.body.classList.remove('focus');$('#focus').setAttribute('aria-pressed','false')}
  $$('.modeBtn,#modes button').forEach(b=>b.disabled=false);
  // stats
  let tl=0,tw=0;
  $$('.scene').forEach(sc=>{
    const mine=[...sc.querySelectorAll('.bubble.mine')];
    const w=mine.reduce((a,b)=>a+words(b.querySelector('.full').textContent),0);
    tl+=mine.length;tw+=w;
    sc.querySelector('[data-scene-stat]').textContent=role&&mine.length?`Твої репліки в цій сцені: ${mine.length}, слів: ${w}`:'';
  });
  $('#stats').innerHTML=role?`<span>Роль: <b>${esc(role)}</b>${ACTOR[role]?' · '+ACTOR[role]:''}</span><span>Реплік: <b>${tl}</b></span><span>Слів: <b>${tw}</b></span>`:'<span>Обери роль у верхній панелі, щоб вчити свої репліки</span>';
  store.set('komiks-role',role);
}
roleSel.addEventListener('change',applyRole);

/* modes */
function setMode(m){
  document.body.dataset.mode=m;
  $$('#modes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  $$('.bubble.revealed').forEach(b=>b.classList.remove('revealed'));
  store.set('komiks-mode',m);
}
$('#modes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode)});
$('#focus').addEventListener('click',()=>{const on=!document.body.classList.contains('focus');document.body.classList.toggle('focus',on);$('#focus').setAttribute('aria-pressed',String(on))});

/* reveal on tap */
const toggleReveal=b=>{if(b&&b.classList.contains('mine'))b.classList.toggle('revealed')};
$('#root').addEventListener('click',e=>toggleReveal(e.target.closest('.bubble')));
$('#root').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('bubble')){e.preventDefault();toggleReveal(e.target)}});

/* theme */
const root=document.documentElement;
function curTheme(){return root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
$('#theme').addEventListener('click',()=>{const n=curTheme()==='dark'?'light':'dark';root.dataset.theme=n;store.set('komiks-theme',n)});
const savedTheme=store.get('komiks-theme');if(savedTheme==='dark'||savedTheme==='light')root.dataset.theme=savedTheme;

const sr=store.get('komiks-role');if(sr&&seen.includes(sr))roleSel.value=sr;
const sm=store.get('komiks-mode');if(['show','hint','hide'].includes(sm))setMode(sm);
applyRole();
</script>
